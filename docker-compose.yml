services:
  # ----------------------------------------------------------------------------
  # 1. DỊCH VỤ CƠ SỞ DỮ LIỆU MYSQL (DATABASE SERVICE)
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: clinova_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secure_pass_2026}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hospital_ai}
      MYSQL_USER: ${MYSQL_USER:-clinic_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-clinic_secure_pass_2026}
    ports:
      - "3307:3306" # Mở cổng 3307 ở máy host tránh xung đột với MySQL cài sẵn
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_secure_pass_2026}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - clinova_network

  # ----------------------------------------------------------------------------
  # 2. DỊCH VỤ ỨNG DỤNG FASTAPI (APPLICATION SERVICE)
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinova_fastapi_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - PORT=8000
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-clinic_user}:${MYSQL_PASSWORD:-clinic_secure_pass_2026}@db:3306/${MYSQL_DATABASE:-hospital_ai}
    ports:
      - "8000:8000"
    volumes:
      - app_uploads:/app/static/uploads
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - clinova_network

# ------------------------------------------------------------------------------
# VOLUMES & NETWORKS
# ------------------------------------------------------------------------------
volumes:
  mysql_data:
    driver: local
  app_uploads:
    driver: local
  sqlite_data:
    driver: local

networks:
  clinova_network:
    driver: bridge

