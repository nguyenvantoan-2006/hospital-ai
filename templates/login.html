<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinova</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Google Font: Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    :root {
      --primary-color: #1A73E8;
      --primary-dark: #1557B0;
      --bg-color: #F8FAFC;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0F172A 0%, #1E293B 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      overflow: hidden;
      max-width: 440px;
      width: 100%;
      background: #ffffff;
    }

    .login-header {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
      padding: 36px 30px;
      text-align: center;
      color: white;
    }

    .btn-login {
      background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
      border: none;
      color: white;
      font-weight: 700;
      padding: 12px;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(26, 115, 232, 0.4);
      color: white;
    }

    .quick-role-badge {
      cursor: pointer;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 8px;
      transition: all 0.2s;
    }

    .quick-role-badge:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body>

  <div class="login-card mx-3">
    <!-- Header -->
    <div class="login-header text-center">
      <div class="rounded-circle shadow-lg mb-3 mx-auto overflow-hidden d-flex align-items-center justify-content-center"
           style="width: 110px; height: 110px; border: 3px solid #ffffff; background: #ffffff;">
        <img src="/static/img/clinic_avatar.png" alt="Clinova Logo" style="width: 100%; height: 100%; object-fit: contain; padding: 2px;" />
      </div>
      <h4 class="fw-bold mb-1">Clinova</h4>
      <p class="text-white-50 small mb-0">Hệ thống Quản lý Phòng khám Thông minh</p>
    </div>

    <!-- Body Form -->
    <div class="card-body p-4 p-sm-5">

      <div id="alertBox" class="alert alert-danger d-none py-2 px-3 small rounded-3 mb-3"></div>

      <form id="formLogin" onsubmit="handleLogin(event)">

        <div class="mb-3">
          <label for="username" class="form-label small fw-bold text-secondary">Tên đăng nhập </label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-primary"></i></span>
            <input type="text" id="username" class="form-control border-start-0" placeholder="Nhập username" required />
          </div>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label small fw-bold text-secondary">Mật khẩu </label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-primary"></i></span>
            <input type="password" id="password" class="form-control border-start-0 border-end-0" placeholder="Nhập mật khẩu" required />
            <span class="input-group-text bg-white cursor-pointer" id="togglePassword" style="cursor: pointer;">
              <i class="fa-solid fa-eye text-muted"></i>
            </span>
          </div>
        </div>

        <button type="submit" id="btnLogin" class="btn btn-login w-100 mb-4">
          <i class="fa-solid fa-right-to-bracket me-2"></i> ĐĂNG NHẬP HỆ THỐNG
        </button>

      </form>

      <!-- Footer Message -->
      <div class="pt-3 border-top text-center">
        <p class="text-muted fw-medium mb-0" style="font-size: 13px;">
          Cảm ơn bạn đã sử dụng Hệ thống Clinova!
        </p>
      </div>

    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script src="/static/js/auth.js"></script>
  <script>
    const API_LOGIN_URL = "/api/v1/auth/login";

    // Nếu đã đăng nhập, tự động chuyển hướng vào trang chính của role
    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("access_token");
      const role = localStorage.getItem("role");
      if (token && role) {
        const homePage = DEFAULT_HOME_PAGE[role] || "dashboard.html";
        window.location.href = homePage;
      }
    });

    function quickFill(user, pass) {
      document.getElementById("username").value = user;
      document.getElementById("password").value = pass;
    }

    async function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const alertBox = document.getElementById("alertBox");
      const btn = document.getElementById("btnLogin");

      alertBox.classList.add("d-none");
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin me-2"></i> Đang xác thực...`;

      try {
        const response = await fetch(API_LOGIN_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
          const err = await response.json().catch(() => ({}));
          throw new Error(err.detail || "Đăng nhập thất bại. Kiểm tra lại thông tin!");
        }

        const data = await response.json();

        // Lưu JWT Token và thông tin User vào localStorage
        localStorage.setItem("access_token", data.access_token);
        localStorage.setItem("username", data.username);
        localStorage.setItem("role", data.role);

        // Điều hướng theo Role (RBAC)
        let redirectUrl = DEFAULT_HOME_PAGE[data.role] || "dashboard.html";
        window.location.href = redirectUrl;

      } catch (error) {
        console.error("Lỗi đăng nhập:", error);
        alertBox.innerText = error.message;
        alertBox.classList.remove("d-none");
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-right-to-bracket me-2"></i> ĐĂNG NHẬP HỆ THỐNG`;
      }
    }

    // Bật/tắt hiển thị mật khẩu
    document.getElementById('togglePassword')?.addEventListener('click', function (e) {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    });
  </script>
</body>

</html>
